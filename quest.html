<div class="container">
    <h1>Quest Selection</h1>
    <form id="quest-form">
        <div class="equipment-selection row">
        <div class="equipment col">
        <label><h5>Daggers</h5></label>
        <br>
        <label><input class="form-check-input mt-0" type="checkbox"  aria-label="Checkbox for following text input" value="PoleD"><h6> Pole Dagger </h6></label><br>
        <label><input class="form-check-input mt-0" type="checkbox"  aria-label="Checkbox for following text input" value="TornadoD"> <h6>Tornado Dagger </h6></label><br>
        <label><input class="form-check-input mt-0" type="checkbox"  aria-label="Checkbox for following text input" value="OverlandD"> <h6>Overland Dagger</h6> </label><br>
        <label><input class="form-check-input mt-0" type="checkbox"  aria-label="Checkbox for following text input" value="WarmD"> <h6>Warm Dagger</h6> </label><br>
        <label><input class="form-check-input mt-0" type="checkbox"  aria-label="Checkbox for following text input" value="ShadowD"> <h6>Shadow Dagger</h6> </label><br>
        <label><input class="form-check-input mt-0" type="checkbox"  aria-label="Checkbox for following text input" value="GhostlyD"><h6>Ghostly Dagger</h6>  </label><br>
        <label><input class="form-check-input mt-0" type="checkbox"  aria-label="Checkbox for following text input" value="DeityD"> <h6>Deity Dagge</h6>r </label><br>
        <label><input class="form-check-input mt-0" type="checkbox"  aria-label="Checkbox for following text input" value="OriginalD"><h6>Original Dagger</h6>  </label><br>
        <label><input class="form-check-input mt-0" type="checkbox"  aria-label="Checkbox for following text input" value="ZombieD"> <h6>Zombie Dagger</h6> </label><br>
        <label><input class="form-check-input mt-0" type="checkbox"  aria-label="Checkbox for following text input" value="AlkaloidD"> <h6>Alkaloid Dagger</h6> </label>
        <br>
        </div>
        <div class="equipment col">
            <label for="headgear-1"><h5>Armors</h5></label>
            <br>
            <label><input class="form-check-input mt-0" type="checkbox" value="" aria-label="Checkbox for following text input" value="WaterA"> <h6>Water Armor </h6></label><br>
            <label><input class="form-check-input mt-0" type="checkbox" value="" aria-label="Checkbox for following text input" value="WindA"><h6> Wind Armor </h6></label><br>
            <label><input class="form-check-input mt-0" type="checkbox" value="" aria-label="Checkbox for following text input" value="EarthA"> <h6>Earth Armor </h6></label><br>
            <label><input class="form-check-input mt-0" type="checkbox" value="" aria-label="Checkbox for following text input" value="FireA"> <h6>Fire Armor </h6></label><br>
            <label><input class="form-check-input mt-0" type="checkbox" value="" aria-label="Checkbox for following text input" value="ShadowA"><h6> Shadow Armor </h6></label><br>
            <label><input class="form-check-input mt-0" type="checkbox" value="" aria-label="Checkbox for following text input" value="GhostA"> <h6>Ghost Armor </h6></label><br>
            <label><input class="form-check-input mt-0" type="checkbox" value="" aria-label="Checkbox for following text input" value="NeutralA"><h6> Neutral Armor</h6> </label><br>
            <label><input class="form-check-input mt-0" type="checkbox" value="" aria-label="Checkbox for following text input" value="UndeadA"><h6> Undead Armor</h6> </label><br>
            <label><input class="form-check-input mt-0" type="checkbox" value="" aria-label="Checkbox for following text input" value="VenomA"><h6> Venom Armor </h6></label>
            <br>
            </div>
        <button type="button" id="show-items-btn">Show Required Items</button>
        </div>
    
    </form>

    <div id="quest-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Required Items</h2>
                <button id="close-modal-btn">&times;</button>
            </div>
            <div class="modal-body">
                <button id="multiply-items-btn">Multiply Items x2</button>
                <table id="items-table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Name</th>
                            <th>Quantity</th>
                            <th>Map 1</th>
                            <th>Map 2</th>
                            <th>Map 3</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- Items will be inserted here dynamically -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>
