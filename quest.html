</head>

<body>
    <div class="menu">
        <nav class="navbar navbar-expand-lg bg-body-tertiary " data-bs-theme="dark">

                <button class="navbar-toggler" type="button" data-bs-toggle="collapse"

    <!--Nav-->
    <div class="container">
        <h1>Quest Selection</h1>
        <form id="quest-form">
            <div class="equipment-selection row">
                <!--Dagas-->
                <div class="equipment col col-3">
                    <label>
                        <h4>Daggers</h4>
                    </label>
                    <br>
                    <p class="h6"><label><input class="form-check-input mt-0" type="checkbox" value="PoleD"> Pole
                            Dagger (Water)</label><br></p>
                    <p class="h6"><label><input class="form-check-input mt-0" type="checkbox" value="TornadoD"> Tornado
                            Dagger(Wind)</label><br></p>
                    <p class="h6"><label><input class="form-check-input mt-0" type="checkbox" value="OverlandD">
                            Overland Dagger (Earth)</label><br></p>
                    <p class="h6"><label><input class="form-check-input mt-0" type="checkbox" value="WarmD"> Warm
                            Dagger (Fire)</label><br></p>
                    <p class="h6"><label><input class="form-check-input mt-0" type="checkbox" value="ShadowD"> Shadow
                            Dagger (Shadow)</label><br></p>
                    <p class="h6"><label><input class="form-check-input mt-0" type="checkbox" value="GhostlyD">Ghostly
                            Dagger (Ghost)</label><br></p>
                    <p class="h6"><label><input class="form-check-input mt-0" type="checkbox" value="DeityD"> Deity
                            Dagge (Holy)</label><br></p>
                    <p class="h6"><label><input class="form-check-input mt-0" type="checkbox" value="OriginalD">Original
                            Dagger (Neutral)</label><br></p>
                    <p class="h6"><label><input class="form-check-input mt-0" type="checkbox" value="ZombieD"> Zombie
                            Dagger (Undead)</label><br></p>
                    <p class="h6"><label><input class="form-check-input mt-0" type="checkbox" value="AlkaloidD">
                            Alkaloid Dagger (Venom)</label></p>
                    <br>
                </div>
                <!--Armors-->
                <div class="equipment col col-3">
                    <label for="headgear-1">
                        <h4>Armors</h4>
                    </label>
                    <br>
                    <p class="h6"><label><input class="form-check-input mt-0" type="checkbox" value="WaterA"> Water
                            Armor </label><br></p>
                    <p class="h6"><label><input class="form-check-input mt-0" type="checkbox" value="WindA"> Wind Armor
                        </label><br></p>
                    <p class="h6"><label><input class="form-check-input mt-0" type="checkbox" value="EarthA"> Earth
                            Armor </label><br></p>
                    <p class="h6"><label><input class="form-check-input mt-0" type="checkbox" value="FireA"> Fire Armor
                        </label><br></p>
                    <p class="h6"><label><input class="form-check-input mt-0" type="checkbox" value="ShadowA"> Shadow
                            Armor </label><br></p>
                    <p class="h6"><label><input class="form-check-input mt-0" type="checkbox" value="GhostA"> Ghost
                            Armor </label><br></p>
                    <p class="h6"><label><input class="form-check-input mt-0" type="checkbox" value="NeutralA"> Neutral
                            Armor </label><br></p>
                    <p class="h6"><label><input class="form-check-input mt-0" type="checkbox" value="UndeadA"> Undead
                            Armor </label><br></p>
                    <p class="h6"><label><input class="form-check-input mt-0" type="checkbox" value="VenomA"> Venom
                            Armor </label></p>
                    <br>
                </div>
                <!--Manteau-->
                <div class="equipment col col-3">
                    <label for="headgear-1">
                        <h4>Garmet</h4>
                    </label>
                    <br>
                    <p class="h6"><label><input class="form-check-input mt-0" type="checkbox" value="WaterG"> Water
                            Garmet </label><br></p>
                    <p class="h6"><label><input class="form-check-input mt-0" type="checkbox" value="WindG"> Wind Garmet
                        </label><br></p>
                    <p class="h6"><label><input class="form-check-input mt-0" type="checkbox" value="EarthG"> Earth
                            Garmet </label><br></p>
                    <p class="h6"><label><input class="form-check-input mt-0" type="checkbox" value="FireG"> Fire Garmet
                        </label><br></p>
                    <p class="h6"><label><input class="form-check-input mt-0" type="checkbox" value="ShadowG"> Shadow
                            Garmet </label><br></p>
                    <p class="h6"><label><input class="form-check-input mt-0" type="checkbox" value="GhostG"> Ghost
                            Garmet </label><br></p>
                    <p class="h6"><label><input class="form-check-input mt-0" type="checkbox" value="NeutralG"> Neutral
                            Garmet </label><br></p>
                    <p class="h6"><label><input class="form-check-input mt-0" type="checkbox" value="UndeadG"> Undead
                            Garmet </label><br></p>
                    <p class="h6"><label><input class="form-check-input mt-0" type="checkbox" value="VenomG"> Venom
                            Garmet </label></p>
                    <br>
                </div>
                <!--Boots-->
                <div class="equipment col col-3">
                    <label for="headgear-1">
                        <h4>Boots</h4>
                    </label>
                    <br>
                    <p class="h6"><label><input class="form-check-input mt-0" type="checkbox" value="WaterB"> Water
                            Boots </label><br></p>
                    <p class="h6"><label><input class="form-check-input mt-0" type="checkbox" value="WindB"> Wind Boots
                        </label><br></p>
                    <p class="h6"><label><input class="form-check-input mt-0" type="checkbox" value="EarthB"> Earth
                            Boots </label><br></p>
                    <p class="h6"><label><input class="form-check-input mt-0" type="checkbox" value="FireB"> Fire Boots
                        </label><br></p>
                    <p class="h6"><label><input class="form-check-input mt-0" type="checkbox" value="ShadowB"> Shadow
                            Boots </label><br></p>
                    <p class="h6"><label><input class="form-check-input mt-0" type="checkbox" value="GhostB"> Ghost
                            Boots </label><br></p>
                    <p class="h6"><label><input class="form-check-input mt-0" type="checkbox" value="NeutralB"> Neutral
                            Boots </label><br></p>
                    <p class="h6"><label><input class="form-check-input mt-0" type="checkbox" value="UndeadB"> Undead
                            Boots </label><br></p>
                    <p class="h6"><label><input class="form-check-input mt-0" type="checkbox" value="VenomB"> Venom
                            Boots </label></p>
                    <br>
                </div>
                <!--Shields-->
                <div class="equipment col col-3">
                    <label for="headgear-1">
                        <h4>Shields</h4>
                    </label>
                    <br>
                    <p class="h6"><label><input class="form-check-input mt-0" type="checkbox" value="ShieldE"> Elemental
                            Shield </label><br></p>
                    <p class="h6"><label><input class="form-check-input mt-0" type="checkbox" value="ShieldWB"> Weapon
                            Block Shield
                        </label><br></p>
                </div>
                <!--Accesories-->
                <div class="equipment col col-3">
                    <label for="headgear-1">
                        <h4>Accesories</h4>
                    </label>
                    <br>
                    <p class="h6"><label><input class="form-check-input mt-0" type="checkbox" value="Acc1"> Legendary
                            Warrior Ring</label><br></p>
                    <p class="h6"><label><input class="form-check-input mt-0" type="checkbox" value="Acc2"> Glove of
                            Fortune</label><br></p>
                    <p class="h6"><label><input class="form-check-input mt-0" type="checkbox" value="Acc3"> ring of
                            Life</label><br></p>
                    <p class="h6"><label><input class="form-check-input mt-0" type="checkbox" value="Acc4"> Ring of
                            Hability</label><br></p>
                    <p class="h6"><label><input class="form-check-input mt-0" type="checkbox" value="Acc5"> Sonido
                            Glove</label><br></p>
                    <p class="h6"><label><input class="form-check-input mt-0" type="checkbox" value="Acc6"> Warlock
                            Glove</label><br></p>

                </div>
                <!--Button Action-->
                <button type="button" id="show-items-btn">Show Required Items</button>
            </div>

        </form>

        <div id="quest-modal" class="modal">
            <div class="modal-content">
                <div class="modal-header">
                    <h2>Required Items</h2>
                    <button id="close-modal-btn">&times;</button>
                </div>
                <div class="modal-body">
                    <button id="multiply-items-btn">Multiplicar items x2</button>
                    <table id="items-table">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Name</th>
                                <th>Quantity</th>
                                <th>Map 1</th>
                                <th>Map 2</th>
                                <th>Map 3</th>
                            </tr>
                        </thead>
                        <tbody>
                            <!-- Items will be inserted here dynamically -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
        <script src="script_quest.js"></script>
</body>

</html>
